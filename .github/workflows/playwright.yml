name: Playwright Tests
on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]
jobs:
    test:
        timeout-minutes: 60
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: lts/*
            - name: Install dependencies
              run: npm ci
            - name: Type-check
              run: npm run typecheck
            - name: Check formatting
              run: npm run format:check
            - name: Install Playwright Browsers
              run: npx playwright install --with-deps
            # APIs tests are not executed in CI as bot detection in production environment returns 403 Forbidden. The API tests are executed in local environment only.
            - name: Run Playwright e2etests
              run: npm run test:e2e
            - uses: actions/upload-artifact@v4
              if: ${{ !cancelled() }}
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 30
            - name: Upload Allure results
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v4
              with:
                  name: allure-results
                  path: allure-results/
                  retention-days: 30
            - name: Upload test-results (traces/screenshots/videos)
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v4
              with:
                  name: test-results
                  path: test-results/
                  retention-days: 30
